<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="对照单次满减活动中凑单前后的实付金额，查看还差多少到门槛以及支出差额。">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>满减凑单计算器 · Daily Useful Tools</title>
<style>
:root { color-scheme: light; --ink: #243b31; --muted: #526258; --line: #d5dbcf; --paper: #fffef9; --accent: #a64526; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: #f5f3ea; color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
a { color: inherit; text-underline-offset: 4px; }
header, main { max-width: 1120px; margin: auto; padding: 24px 28px; }
header { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; border-bottom: 1px solid var(--line); font-size: 13px; }
.brand { font-weight: 750; letter-spacing: .06em; text-decoration: none; }
.eyebrow { color: var(--accent); font-size: 13px; font-weight: 700; }
h1 { font-size: clamp(32px, 5vw, 54px); line-height: 1.15; margin: 12px 0; }
.intro, .note { color: var(--muted); }
.intro { margin: 0 0 24px; }
.workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); padding: 20px; }
.result { background: #edf2e8; }
h2 { font-size: 18px; margin: 0 0 12px; }
label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 650; }
input, button { font: inherit; }
input { width: 100%; min-width: 0; color: inherit; background: var(--paper); border: 1px solid #aebaae; border-radius: 7px; padding: 9px 10px; }
.field + .field { margin-top: 12px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.pair > div { min-width: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
button { min-height: 44px; cursor: pointer; border-radius: 7px; border: 1px solid #aebaae; background: var(--paper); color: var(--ink); padding: 7px 12px; }
.primary { background: var(--ink); color: white; border-color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.note, #status, #qualification, #gap { font-size: 14px; }
#status { margin: 0; }
#status[data-error] { color: #9d2c22; }
dl { margin: 12px 0 0; }
dl > div { padding: 10px 0; border-top: 1px solid var(--line); }
dt { color: var(--muted); font-size: 14px; }
dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 750; overflow-wrap: anywhere; font-size: 23px; }
#difference { font-size: clamp(28px, 4vw, 40px); color: var(--accent); }
footer { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 15px; font-size: 13px; color: var(--muted); }
@media (max-width: 720px) {
  header, main { padding: 18px; }
  .workspace { grid-template-columns: 1fr; gap: 14px; }
  .panel { padding: 15px; }
}
@media (max-width: 350px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="./index.html">↗ DAILY USEFUL TOOLS</a>
  <span>023 / CART THRESHOLD</span>
  <a href="https://github.com/zhongwilliam51-crypto/daily-useful-tools">GitHub ↗</a>
</header>
<main>
  <div class="eyebrow">日常购物</div>
  <h1>满减凑单计算器</h1>
  <p class="intro">还差一点才满减？填入原金额和准备加购的金额，对照凑单前后实际要付多少。</p>
  <div class="workspace">
    <section class="panel" aria-labelledby="input-heading">
      <h2 id="input-heading">01 / 单次满减活动</h2>
      <form id="cart" autocomplete="off">
        <div class="field">
          <label for="current">当前参与活动的商品金额 · 优惠前</label>
          <input id="current" type="text" inputmode="decimal" placeholder="例如 270">
        </div>
        <div class="pair">
          <div><label for="threshold">满多少</label><input id="threshold" type="text" inputmode="decimal" placeholder="例如 300"></div>
          <div><label for="reduction">减多少</label><input id="reduction" type="text" inputmode="decimal" placeholder="例如 40"></div>
        </div>
        <div class="field" style="margin-top:12px">
          <label for="extra">计划加购金额 · 同样参与活动</label>
          <input id="extra" type="text" inputmode="decimal" placeholder="例如 30">
        </div>
        <div class="actions">
          <button class="primary" type="submit">对照实付 ↗</button>
          <button id="example" type="button">试试示例</button>
          <button id="clear" type="button">清空</button>
        </div>
      </form>
      <p class="note">所有金额按同一币种填写，最多两位小数。</p>
    </section>
    <section class="panel result" aria-labelledby="result-heading">
      <h2 id="result-heading">02 / 凑单前后实付</h2>
      <p id="status" role="status">填好后对照，或先试试示例。</p>
      <div id="figures" hidden>
        <dl>
          <div><dt>当前订单实付</dt><dd id="before"></dd></div>
          <div><dt>加购后订单实付</dt><dd id="after"></dd></div>
          <div><dt>与当前订单相比</dt><dd id="difference"></dd></div>
        </dl>
        <p id="gap"></p>
        <p id="qualification"></p>
      </div>
    </section>
  </div>
  <p class="note">按“达到门槛减一次”计算，凑单前后各核对同一优惠。仅计参与活动的商品金额。优惠叠加、运费和商品资格以结算页为准。</p>
  <footer>在当前浏览器计算。下载本页后可离线使用。</footer>
</main>

<script id="cart-threshold-core">
function cartCents(raw, label) {
  const text = raw.trim();
  if (!/^\d{1,7}(?:\.\d{1,2})?$/.test(text)) {
    throw new Error(label + '请填 0–1,000,000 之间的金额，最多两位小数。');
  }
  const [whole, fraction = ''] = text.split('.');
  const cents = Number(whole) * 100 + Number(fraction.padEnd(2, '0'));
  if (cents > 100000000) throw new Error(label + '不能超过 1,000,000。');
  return cents;
}

function compareCart(input) {
  const current = cartCents(input.current, '当前金额');
  const threshold = cartCents(input.threshold, '满减门槛');
  const reduction = cartCents(input.reduction, '优惠金额');
  const extra = cartCents(input.extra, '加购金额');
  if (threshold === 0) throw new Error('满减门槛须大于 0。');
  if (reduction > threshold) throw new Error('优惠金额不能大于满减门槛。');
  const subtotal = current + extra;
  const beforeDiscount = current >= threshold ? reduction : 0;
  const afterDiscount = subtotal >= threshold ? reduction : 0;
  const before = current - beforeDiscount;
  const after = subtotal - afterDiscount;
  return {
    before, after, difference: after - before,
    gapBefore: Math.max(0, threshold - current),
    gapAfter: Math.max(0, threshold - subtotal),
    beforeDiscount, afterDiscount,
  };
}

function cartMoney(cents) {
  return (cents / 100).toFixed(2);
}
</script>
<script>
const byId = id => document.getElementById(id);
const form = byId('cart');
const status = byId('status');
const figures = byId('figures');
const fields = ['current', 'threshold', 'reduction', 'extra'];

function showStatus(message, error = false) {
  status.textContent = message;
  status.toggleAttribute('data-error', error);
}

function calculate() {
  figures.hidden = true;
  try {
    const input = Object.fromEntries(fields.map(field => [field, byId(field).value]));
    const result = compareCart(input);
    byId('before').textContent = cartMoney(result.before);
    byId('after').textContent = cartMoney(result.after);
    byId('difference').textContent = result.difference === 0
      ? '实付相同'
      : (result.difference > 0 ? '多付 ' : '少付 ') + cartMoney(Math.abs(result.difference));
    byId('gap').textContent = result.gapBefore > 0
      ? '原金额还差 ' + cartMoney(result.gapBefore) + ' 达到门槛。'
      : '原金额已经达到门槛。';
    byId('qualification').textContent = result.gapAfter > 0
      ? '加购后仍差 ' + cartMoney(result.gapAfter) + '，本次满减尚未生效。'
      : '加购后达到门槛，减去 ' + cartMoney(result.afterDiscount) + '。';
    figures.hidden = false;
    showStatus('已按同一满减规则核对两笔订单。');
  } catch (error) {
    showStatus(error.message, true);
  }
}

form.addEventListener('submit', event => {
  event.preventDefault();
  calculate();
});
form.addEventListener('input', () => {
  figures.hidden = true;
  showStatus('金额已更新，请重新对照。');
});
byId('example').addEventListener('click', () => {
  const example = {current: '270', threshold: '300', reduction: '40', extra: '30'};
  for (const field of fields) byId(field).value = example[field];
  calculate();
});
byId('clear').addEventListener('click', () => {
  form.reset();
  figures.hidden = true;
  showStatus('已清空，填写新的活动金额后可重新对照。');
  byId('current').focus();
});
</script>
</body>
</html>
